[project]
name = "backend"
version = "0.0.0"
description = "OpenSecDash App Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    # Keep greenlet on a patch release with a locked sdist for release evidence.
    "greenlet>=3.5.6,<3.5.7",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "paho-mqtt>=2.1.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyright>=1.1.414",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
