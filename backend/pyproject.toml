[project]
name = "backend"
version = "0.0.0"
description = "OpenSecDash App Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.7.2",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    # Keep greenlet on a patch release with a locked sdist for release evidence.
    "greenlet>=3.5.5,<3.5.6",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "paho-mqtt>=2.1.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyright>=1.1.411",
    "httpx2>=2.12.0",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
